name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: skytrax
          POSTGRES_USER: skytrax
          POSTGRES_PASSWORD: skytrax
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skytrax -d skytrax"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://skytrax:skytrax@localhost:5432/skytrax
      REDIS_URL: redis://localhost:6379/0
      NLP_ENABLE_EMBEDDINGS: "false"
      API_TRUSTED_HOSTS: "testserver,localhost,127.0.0.1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --default-timeout=100 -r requirements.txt
          pip install pytest pytest-cov httpx ruff

      - name: Lint
        run: ruff check .

      - name: Validate migrations
        run: |
          alembic upgrade head
          alembic check

      - name: Run tests
        run: pytest --cov --cov-report=term-missing

      - name: Scrapy smoke
        run: scrapy list | grep airlinequality_reviews

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Create .env for compose validation
        run: cp .env.example .env
      - name: Validate compose files
        run: |
          docker compose config
          docker compose -f docker-compose.prod.yml config
      - name: Build backend image
        run: docker compose build --build-arg INSTALL_PLAYWRIGHT=false app worker
      - name: Build frontend image
        run: docker compose -f docker-compose.prod.yml build frontend
