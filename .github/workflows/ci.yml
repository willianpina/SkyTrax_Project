name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PYTHONPATH: ${{ github.workspace }}
  DATABASE_URL: "postgresql+psycopg://skytrax:skytrax@localhost:5432/skytrax"
  REDIS_URL: "redis://localhost:6379/0"
  NLP_ENABLE_EMBEDDINGS: "false"
  SCHEMA_VALIDATE_ON_STARTUP: "false"
  API_TRUSTED_HOSTS: "testserver,localhost,127.0.0.1"

jobs:
  lint:
    name: Lint & import smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --default-timeout=120 -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Import smoke (FastAPI app)
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: "sqlite:///:memory:"
          NLP_ENABLE_EMBEDDINGS: "false"
          SCHEMA_VALIDATE_ON_STARTUP: "false"
        run: python -c "from main import app; assert app.title"

      - name: Scrapy registration smoke
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: scrapy list | grep -q airlinequality_reviews

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          npm ci --no-audit --no-fund
          npm run build

  test:
    name: Tests & migrations
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: lint
    services:
      postgres:
        image: "pgvector/pgvector:pg16"
        env:
          POSTGRES_DB: skytrax
          POSTGRES_USER: skytrax
          POSTGRES_PASSWORD: skytrax
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skytrax -d skytrax"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --default-timeout=120 -r requirements-dev.txt

      - name: Validate migrations
        run: alembic upgrade head

      - name: Pytest collection smoke
        run: pytest --collect-only -q

      - name: Run pytest
        run: |
          pytest --cov --cov-report=term-missing -q \
            --ignore=tests/test_metadata_extractor.py

  docker:
    name: Docker compose
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for compose validation
        run: cp .env.example .env

      - name: Validate compose files
        run: |
          docker compose config
          docker compose -f docker-compose.prod.yml config

      - name: Build backend images
        run: |
          docker compose build \
            --build-arg INSTALL_PLAYWRIGHT=false \
            app worker scheduler

      - name: Build frontend production image
        run: docker compose -f docker-compose.prod.yml build frontend

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --default-timeout=120 -r requirements-dev.txt

      - name: pip-audit
        run: pip-audit -r requirements.txt
