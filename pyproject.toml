[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"tests/conftest.py" = ["E402"]
"tests/test_metadata_extractor.py" = ["E402"]
"tests/test_pipeline_resilience.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["api", "app", "analytics", "database", "nlp", "pipelines", "scraper", "worker"]
omit = ["*/migrations/*", "tests/*"]

[tool.coverage.report]
# CI enforces coverage gradually: 45 → 55 → 70 (see docs/testing/coverage.md).
fail_under = 45
show_missing = true
